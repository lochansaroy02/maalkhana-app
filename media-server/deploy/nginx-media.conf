# /etc/nginx/sites-available/maalkhana-media
# Replace media.example.com and the folder if you changed MEDIA_ROOT.
# After `certbot --nginx -d media.example.com` certbot adds the HTTPS (443) parts.

server {
    listen 80;
    server_name media.example.com;

    # Must be a little larger than MAX_UPLOAD_MB.
    client_max_body_size 25m;

    # Uploads -> media server (Node, localhost only)
    location = /upload {
        proxy_pass http://127.0.0.1:4100/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4100/health;
    }

    # Files -> straight from disk (the CDN caches these)
    location /files/ {
        alias /var/www/maalkhana-media/;
        autoindex off;
        limit_except GET HEAD { deny all; }

        # File names are random and never reused, so caching forever is safe.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;

        # Never run or render anything as a web page.
        location ~* \.(html?|svg|js|php)$ { return 404; }
        location ~ /_info\.json$ { return 404; }
    }

    location / {
        return 404;
    }
}
